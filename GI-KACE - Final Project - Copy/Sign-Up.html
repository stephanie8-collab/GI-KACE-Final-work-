<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - LUXE</title>
    <link rel="stylesheet" href="Sign-Up.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>LUXE</h1>
        <a href="#" id="shop-link">BACK TO SHOP</a>
     </header>

      

     <main> 
        <div class="introcontainer">
            <h2 class="intro">Create Account</h2>
                  <h2 class="intro2"><p>Join the circle of curated elegance.</p></h2>
        </div>
        <div class="card">
            <form >
                <label>Fullname</label>
                <input type="text" placeholder="Ericater Amponsah">
                <label>Email</label>
                <input type="email" placeholder="email@example.com">
                <label>Password</label>
                <input type="password" placeholder="Password">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm Password">
                <button class="create-btn">Create Account</button>
                <P class="or">or</P>
                <button class="google-btn">Sign Up with Google</button>
                <P class="login">Already have an acount?
                    <a href="#">Log in</a>
                </P>
            </form>
        </div>
     </main>
     <p class="quote">
        Style is a way to say who you are without having to speak.
     </p>
    
     <footer>
        <P>@ 2024 LUXE COLLECTIVE</P>
        <div>
            <a href="#">Privacy</a>

            <a href="#">Contact</a>
        </div>
     </footer>
    
</body>
