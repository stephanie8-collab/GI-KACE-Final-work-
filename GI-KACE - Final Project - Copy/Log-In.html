<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - LUXE</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
  <link rel="stylesheet" href="Log-In.css" />
</head>
<body>
  <main class="page">

<div class="maincontainer">
    
        <section class="left-side">
          <header>
            <h1>LUXE</h1>
          </header>
          <h2>The standard of <br /> modern curation.</h2>
          <p class="description">
            Access your private collection and curated recommendations with quiet confidence.
          </p>
        </section>
    
        <section class="login-in">
          <header>
            <h1>Welcome back</h1>
            <p>Please enter your details to continue.</p>
          </header>
    
          <form>
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" required />
    
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required />
    
            <div class="remember">
              <label class="checkbox">
                <input type="checkbox" />
                Remember for 30 days
              </label>
              <a href="#">Forgot Password?</a>
            </div>
    
            <button class="signin-btn" type="submit">Sign In</button>
    
            <p class="continue">OR CONTINUE WITH</p>
    
            <div class="social">
              <button type="button">Google</button>
              <button type="button">Apple</button>
            </div>
    
            <p class="account">
              New here?
              <a href="#">Create an account</a>
            </p>
          </form>
        </section>
</div>

  </main>

   
     <footer>
        <P>@ 2024 LUXE COLLECTIVE</P>
        <div>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Contact</a>
        </div>
     </footer>
</body>
</html>
